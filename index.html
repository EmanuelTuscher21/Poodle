<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poodle Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* BACKGROUND THEMES */
    body.theme-light { background-color: #f8fafc; color: #0f172a; }
    body.theme-dark { background-color: #0f172a; color: #f8fafc; }
    body.theme-dark .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important; }
    body.theme-dark .bg-slate-50 { background-color: #0f172a !important; border-color: #334155 !important; color: #f8fafc !important; }
    body.theme-dark input, body.theme-dark [contenteditable="true"] { color: #f8fafc !important; }
    body.theme-blue { background-color: #eff6ff; color: #1e3a8a; }
    body.theme-green { background-color: #f0fdf4; color: #14532d; }
    body.theme-yellow { background-color: #fefce8; color: #713f12; }
    body.theme-red { background-color: #fef2f2; color: #881337; }
  </style>
</head>
<body id="appBody" class="theme-light min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- TOP HEADER / NAVBAR -->
  <header class="sticky top-0 z-30 glass border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
        <i data-lucide="dog" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
          Poodle Workspace
        </h1>
        <p class="text-xs text-slate-500">Your personal workspace & canvas</p>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex items-center gap-2">
      <button id="addBlockBtn" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Add Block</span>
      </button>

      <button id="browseBtn" class="flex items-center gap-1.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg font-medium text-sm transition">
        <i data-lucide="search" class="w-4 h-4"></i>
        <span>Browse</span>
      </button>

      <button id="settingsBtn" class="p-2 text-slate-600 hover:bg-slate-200 rounded-lg transition" title="Settings">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>

      <button id="exportBtn" class="p-2 text-slate-600 hover:bg-slate-200 rounded-lg transition" title="Export Workspace">
        <i data-lucide="download" class="w-5 h-5"></i>
      </button>
      
      <button id="clearAllBtn" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition" title="Clear All Blocks">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CANVAS AREA -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    <div id="workspaceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Blocks will render dynamically here -->
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
      <div class="bg-slate-200/60 p-4 rounded-full mb-3 text-slate-400">
        <i data-lucide="layout" class="w-10 h-10"></i>
      </div>
      <h3 class="text-lg font-semibold text-slate-700">Your workspace is empty</h3>
      <p class="text-sm text-slate-500 max-w-sm mt-1">Press <kbd class="px-2 py-0.5 bg-white border rounded text-xs shadow-sm">Enter</kbd> or click <b>Add Block</b> to start.</p>
    </div>
  </main>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-indigo-600"></i> Workspace Settings
        </h3>
        <button id="closeSettingsBtn" class="p-1 text-slate-400 hover:text-slate-600 rounded">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Background Theme</label>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="setTheme('light')" class="p-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 text-xs font-semibold hover:border-indigo-500 flex flex-col items-center gap-1">
            <span class="w-4 h-4 rounded-full bg-slate-200"></span> Light
          </button>
          <button onclick="setTheme('dark')" class="p-3 rounded-xl border border-slate-300 bg-slate-900 text-white text-xs font-semibold hover:border-indigo-500 flex flex-col items-center gap-1">
            <span class="w-4 h-4 rounded-full bg-slate-700"></span> Dark
          </button>
          <button onclick="setTheme('blue')" class="p-3 rounded-xl border border-blue-200 bg-blue-50 text-blue-800 text-xs font-semibold hover:border-indigo-500 flex flex-col items-center gap-1">
            <span class="w-4 h-4 rounded-full bg-blue-400"></span> Soft Blue
          </button>
          <button onclick="setTheme('green')" class="p-3 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs font-semibold hover:border-indigo-500 flex flex-col items-center gap-1">
            <span class="w-4 h-4 rounded-full bg-emerald-400"></span> Sage Green
          </button>
          <button onclick="setTheme('yellow')" class="p-3 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 text-xs font-semibold hover:border-indigo-500 flex flex-col items-center gap-1">
            <span class="w-4 h-4 rounded-full bg-amber-400"></span> Warm Yellow
          </button>
          <button onclick="setTheme('red')" class="p-3 rounded-xl border border-rose-200 bg-rose-50 text-rose-800 text-xs font-semibold hover:border-indigo-500 flex flex-col items-center gap-1">
            <span class="w-4 h-4 rounded-full bg-rose-400"></span> Rose Red
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- BROWSE / SEARCH MODAL -->
  <div id="browseModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
      <div class="p-4 border-b border-slate-200 flex items-center gap-3">
        <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Search public posts..." class="w-full text-sm outline-none text-slate-800 placeholder-slate-400">
        <button id="closeBrowseBtn" class="p-1 text-slate-400 hover:text-slate-600 rounded">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="searchResults" class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-3">
        <!-- Search Results list dynamically -->
      </div>
    </div>
  </div>

  <!-- FULLSCREEN FOCUS MODAL -->
  <div id="fullscreenModal" class="fixed inset-0 bg-white z-50 hidden flex flex-col p-6">
    <div class="flex items-center justify-between pb-4 border-b border-slate-200">
      <div class="flex items-center gap-3">
        <button id="prevFsBtn" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 transition">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button id="nextFsBtn" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 transition">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
        <span id="fsIndex" class="text-sm text-slate-500 font-medium">Block 1 of 1</span>
      </div>

      <button id="closeFsBtn" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">
        <i data-lucide="minimize-2" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar my-6 max-w-4xl w-full mx-auto space-y-4">
      <input id="fsTitle" type="text" class="text-3xl font-bold w-full outline-none bg-transparent text-slate-900 border-b border-transparent focus:border-indigo-500 py-1" placeholder="Title...">
      <div id="fsContent" contenteditable="true" class="min-h-[300px] outline-none text-slate-700 text-lg leading-relaxed space-y-3"></div>
      <div id="fsImageContainer" class="space-y-4"></div>
    </div>
  </div>

  <!-- DELETE CONFIRMATION DIALOG -->
  <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full space-y-4">
      <div class="flex items-center gap-3 text-red-600">
        <div class="bg-red-100 p-2 rounded-lg">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h3 class="font-bold text-slate-800">Delete Block?</h3>
      </div>
      <p class="text-sm text-slate-600">Are you sure you really want to delete this block? This action cannot be undone.</p>
      <div class="flex justify-end gap-2 pt-2">
        <button id="cancelDeleteBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">Cancel</button>
        <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // DATA STATE
    let blocks = JSON.parse(localStorage.getItem('poodle_blocks')) || [];
    let currentTheme = localStorage.getItem('poodle_theme') || 'light';
    let deleteTargetId = null;
    let currentFsIndex = 0;

    // INITIALIZE
    document.addEventListener('DOMContentLoaded', () => {
      setTheme(currentTheme);
      lucide.createIcons();
      renderBlocks();

      // Enter key creates block when not typing inside text box
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && !e.target.isContentEditable) {
          e.preventDefault();
          addNewBlock();
        }
      });
    });

    // SET THEME
    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('poodle_theme', theme);
      document.getElementById('appBody').className = `theme-${theme} min-h-screen flex flex-col font-sans transition-colors duration-200`;
    }

    // SAVE STATE
    function saveState() {
      localStorage.setItem('poodle_blocks', JSON.stringify(blocks));
      renderBlocks();
    }

    // CREATE BLOCK
    function addNewBlock() {
      const newBlock = {
        id: 'block_' + Date.now(),
        title: 'New Block',
        content: 'Type your text here...',
        images: [],
        isPublic: false, // Default to private
        updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      blocks.unshift(newBlock);
      saveState();
    }

    // RENDER BLOCKS TO CANVAS
    function renderBlocks() {
      const grid = document.getElementById('workspaceGrid');
      const emptyState = document.getElementById('emptyState');

      grid.innerHTML = '';

      if (blocks.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      blocks.forEach((block, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col overflow-hidden';
        
        card.innerHTML = `
          <!-- CARD HEADER -->
          <div class="bg-slate-50 border-b border-slate-200 px-4 py-2.5 flex items-center justify-between gap-2">
            <input type="text" value="${escapeHtml(block.title)}" onchange="updateTitle('${block.id}', this.value)" class="bg-transparent font-semibold text-slate-800 outline-none w-full text-sm focus:border-b focus:border-indigo-500">
            
            <div class="flex items-center gap-1">
              <!-- PRIVACY TOGGLE -->
              <button onclick="togglePrivacy('${block.id}')" class="px-2 py-1 text-xs rounded-md font-medium flex items-center gap-1 transition ${block.isPublic ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}" title="Toggle Public/Private">
                <i data-lucide="${block.isPublic ? 'globe' : 'lock'}" class="w-3.5 h-3.5"></i>
                <span>${block.isPublic ? 'Public' : 'Private'}</span>
              </button>

              <button onclick="openFullscreen(${index})" class="p-1 text-slate-400 hover:text-indigo-600 rounded" title="Full Screen">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
              </button>
              <button onclick="requestDelete('${block.id}')" class="p-1 text-slate-400 hover:text-red-600 rounded" title="Delete">
                <i data-lucide="trash" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- FORMATTING TOOLBAR -->
          <div class="px-4 py-1.5 bg-slate-100/70 border-b border-slate-200 flex items-center gap-1 text-xs text-slate-600 flex-wrap">
            <button onclick="formatText('bold')" class="p-1 hover:bg-slate-200 rounded font-bold" title="Bold">B</button>
            <button onclick="formatText('italic')" class="p-1 hover:bg-slate-200 rounded italic" title="Italic">I</button>
            <button onclick="formatText('underline')" class="p-1 hover:bg-slate-200 rounded underline" title="Underline">U</button>
            
            <span class="text-slate-300">|</span>
            
            <!-- FONT FAMILY -->
            <select onchange="formatText('fontName', this.value)" class="bg-transparent text-xs outline-none cursor-pointer">
              <option value="sans-serif">Sans-Serif</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
              <option value="cursive">Cursive</option>
            </select>

            <!-- FONT SIZE -->
            <select onchange="formatText('fontSize', this.value)" class="bg-transparent text-xs outline-none cursor-pointer">
              <option value="2">Small</option>
              <option value="3" selected>Normal</option>
              <option value="5">Large</option>
              <option value="7">Huge</option>
            </select>

            <!-- TEXT COLOR -->
            <input type="color" onchange="formatText('foreColor', this.value)" class="w-5 h-5 rounded cursor-pointer border-none bg-transparent" title="Text Color">
          </div>

          <!-- EDITABLE CONTENT -->
          <div class="p-4 flex-1 flex flex-col space-y-3">
            <div contenteditable="true" oninput="updateContent('${block.id}', this.innerHTML)" class="outline-none text-slate-600 text-sm min-h-[80px] flex-1">${block.content}</div>

            <!-- IMAGES -->
            <div class="space-y-2">
              ${block.images.map((img, imgIdx) => `
                <div class="relative group rounded-lg overflow-hidden border border-slate-200">
                  <img src="${img}" class="w-full h-32 object-cover">
                  <button onclick="removeImage('${block.id}',${imgIdx})" class="absolute top-1 right-1 bg-black/60 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </div>
              `).join('')}
            </div>

            <!-- IMPORT IMAGE TOOLBAR -->
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <label class="cursor-pointer hover:text-indigo-600 flex items-center gap-1">
                <i data-lucide="image" class="w-3.5 h-3.5"></i>
                <span>Import Picture</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload('${block.id}', event)">
              </label>
              <span>${block.updatedAt}</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    // TEXT FORMATTING EXEC COMMAND
    function formatText(cmd, value = null) {
      document.execCommand(cmd, false, value);
    }

    // PRIVACY TOGGLE
    function togglePrivacy(id) {
      const b = blocks.find(x => x.id === id);
      if (b) {
        b.isPublic = !b.isPublic;
        saveState();
      }
    }

    // UPDATE HANDLERS
    function updateTitle(id, val) {
      const b = blocks.find(x => x.id === id);
      if (b) { b.title = val; saveState(); }
    }

    function updateContent(id, val) {
      const b = blocks.find(x => x.id === id);
      if (b) { b.content = val; localStorage.setItem('poodle_blocks', JSON.stringify(blocks)); }
    }

    function handleImageUpload(id, event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const b = blocks.find(x => x.id === id);
        if (b) {
          b.images.push(e.target.result);
          saveState();
        }
      };
      reader.readAsDataURL(file);
    }

    function removeImage(id, imgIdx) {
      const b = blocks.find(x => x.id === id);
      if (b) {
        b.images.splice(imgIdx, 1);
        saveState();
      }
    }

    // DELETE CONFIRMATION
    function requestDelete(id) {
      deleteTargetId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    document.getElementById('cancelDeleteBtn').onclick = () => {
      deleteTargetId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    };

    document.getElementById('confirmDeleteBtn').onclick = () => {
      if (deleteTargetId) {
        blocks = blocks.filter(x => x.id !== deleteTargetId);
        deleteTargetId = null;
        saveState();
      }
      document.getElementById('deleteModal').classList.add('hidden');
    };

    // SETTINGS MODAL
    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('settingsBtn').onclick = () => settingsModal.classList.remove('hidden');
    document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.add('hidden');

    // BROWSE & SEARCH MODAL (PUBLIC ONLY)
    const browseModal = document.getElementById('browseModal');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    document.getElementById('browseBtn').onclick = () => {
      browseModal.classList.remove('hidden');
      searchInput.value = '';
      renderSearchResults('');
      searchInput.focus();
    };

    document.getElementById('closeBrowseBtn').onclick = () => {
      browseModal.classList.add('hidden');
    };

    searchInput.oninput = (e) => {
      renderSearchResults(e.target.value);
    };

    function renderSearchResults(query) {
      const q = query.toLowerCase().trim();
      // Search ONLY public posts
      const publicBlocks = blocks.filter(b => b.isPublic);
      const filtered = publicBlocks.filter(b => b.title.toLowerCase().includes(q) || b.content.toLowerCase().includes(q));

      searchResults.innerHTML = '';
      if (filtered.length === 0) {
        searchResults.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No public posts matching your search.</div>`;
        return;
      }

      filtered.forEach(block => {
        const item = document.createElement('div');
        item.className = 'p-3 rounded-lg border border-slate-200 hover:border-indigo-500 hover:bg-slate-50 transition cursor-pointer';
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(block.title)}</h4>
            <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium">Public</span>
          </div>
          <p class="text-xs text-slate-500 line-clamp-2 mt-1">${block.content.replace(/<[^>]*>?/gm, '')}</p>
        `;
        item.onclick = () => {
          browseModal.classList.add('hidden');
          const idx = blocks.findIndex(x => x.id === block.id);
          if (idx !== -1) openFullscreen(idx);
        };
        searchResults.appendChild(item);
      });
    }

    // FULLSCREEN FOCUS
    const fsModal = document.getElementById('fullscreenModal');
    const fsTitle = document.getElementById('fsTitle');
    const fsContent = document.getElementById('fsContent');
    const fsImageContainer = document.getElementById('fsImageContainer');

    function openFullscreen(index) {
      currentFsIndex = index;
      loadFsData();
      fsModal.classList.remove('hidden');
    }

    function loadFsData() {
      const b = blocks[currentFsIndex];
      if (!b) return;
      document.getElementById('fsIndex').innerText = `Block ${currentFsIndex + 1} of ${blocks.length}`;
      fsTitle.value = b.title;
      fsContent.innerHTML = b.content;

      fsImageContainer.innerHTML = b.images.map(img => `
        <img src="${img}" class="w-full max-h-[400px] object-cover rounded-xl border border-slate-200">
      `).join('');

      fsTitle.onchange = (e) => { updateTitle(b.id, e.target.value); };
      fsContent.oninput = () => { updateContent(b.id, fsContent.innerHTML); };
    }

    document.getElementById('closeFsBtn').onclick = () => fsModal.classList.add('hidden');
    document.getElementById('prevFsBtn').onclick = () => {
      if (currentFsIndex > 0) { currentFsIndex--; loadFsData(); }
    };
    document.getElementById('nextFsBtn').onclick = () => {
      if (currentFsIndex < blocks.length - 1) { currentFsIndex++; loadFsData(); }
    };

    // UTILS
    document.getElementById('addBlockBtn').onclick = addNewBlock;
    document.getElementById('clearAllBtn').onclick = () => {
      if (confirm('Are you sure you want to delete ALL blocks?')) {
        blocks = [];
        saveState();
      }
    };
    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(blocks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'poodle-workspace.json';
      a.click();
    };

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
