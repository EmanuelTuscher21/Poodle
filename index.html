<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poodle Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- TOP HEADER / NAVBAR -->
  <header class="sticky top-0 z-30 glass border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
        <i data-lucide="dog" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
          Poodle Workspace
        </h1>
        <p class="text-xs text-slate-500">Your personal workspace & canvas</p>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex items-center gap-2">
      <button id="addBlockBtn" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Add Block</span>
      </button>

      <button id="browseBtn" class="flex items-center gap-1.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg font-medium text-sm transition">
        <i data-lucide="search" class="w-4 h-4"></i>
        <span>Browse</span>
      </button>

      <button id="exportBtn" class="p-2 text-slate-600 hover:bg-slate-200 rounded-lg transition" title="Export Workspace">
        <i data-lucide="download" class="w-5 h-5"></i>
      </button>
      
      <button id="clearAllBtn" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition" title="Clear All Blocks">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CANVAS AREA -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    <div id="workspaceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Blocks will render dynamically here -->
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
      <div class="bg-slate-200/60 p-4 rounded-full mb-3 text-slate-400">
        <i data-lucide="layout" class="w-10 h-10"></i>
      </div>
      <h3 class="text-lg font-semibold text-slate-700">Your workspace is empty</h3>
      <p class="text-sm text-slate-500 max-w-sm mt-1">Press <kbd class="px-2 py-0.5 bg-white border rounded text-xs shadow-sm">Enter</kbd> or click <b>Add Block</b> to start writing or importing images.</p>
    </div>
  </main>

  <!-- BROWSE / SEARCH MODAL -->
  <div id="browseModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
      <div class="p-4 border-b border-slate-200 flex items-center gap-3">
        <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Search posts by title or content..." class="w-full text-sm outline-none text-slate-800 placeholder-slate-400">
        <button id="closeBrowseBtn" class="p-1 text-slate-400 hover:text-slate-600 rounded">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="searchResults" class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-3">
        <!-- Search Results list dynamically -->
      </div>
    </div>
  </div>

  <!-- FULLSCREEN FOCUS MODAL -->
  <div id="fullscreenModal" class="fixed inset-0 bg-white z-50 hidden flex flex-col p-6">
    <div class="flex items-center justify-between pb-4 border-b border-slate-200">
      <div class="flex items-center gap-3">
        <button id="prevFsBtn" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 transition">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button id="nextFsBtn" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 transition">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
        <span id="fsIndex" class="text-sm text-slate-500 font-medium">Block 1 of 1</span>
      </div>

      <button id="closeFsBtn" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">
        <i data-lucide="minimize-2" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar my-6 max-w-4xl w-full mx-auto space-y-4">
      <input id="fsTitle" type="text" class="text-3xl font-bold w-full outline-none bg-transparent text-slate-900 border-b border-transparent focus:border-indigo-500 py-1" placeholder="Title...">
      <div id="fsContent" contenteditable="true" class="min-h-[300px] outline-none text-slate-700 text-lg leading-relaxed space-y-3"></div>
      <div id="fsImageContainer" class="space-y-4"></div>
    </div>
  </div>

  <!-- DELETE CONFIRMATION DIALOG -->
  <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full space-y-4">
      <div class="flex items-center gap-3 text-red-600">
        <div class="bg-red-100 p-2 rounded-lg">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h3 class="font-bold text-slate-800">Delete Block?</h3>
      </div>
      <p class="text-sm text-slate-600">Are you sure you really want to delete this block? This action cannot be undone.</p>
      <div class="flex justify-end gap-2 pt-2">
        <button id="cancelDeleteBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">Cancel</button>
        <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // DATA STATE
    let blocks = JSON.parse(localStorage.getItem('poodle_blocks')) || [];
    let deleteTargetId = null;
    let currentFsIndex = 0;

    // INITIALIZE
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderBlocks();

      // Keyboard Shortcut: Press Enter outside text areas to create block
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName) && !e.target.isContentEditable) {
          e.preventDefault();
          addNewBlock();
        }
      });
    });

    // SAVE STATE
    function saveState() {
      localStorage.setItem('poodle_blocks', JSON.stringify(blocks));
      renderBlocks();
    }

    // CREATE BLOCK
    function addNewBlock() {
      const newBlock = {
        id: 'block_' + Date.now(),
        title: 'New Block',
        content: 'Type your text here...',
        images: [],
        updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      blocks.unshift(newBlock);
      saveState();
    }

    // RENDER BLOCKS TO FRONT PAGE
    function renderBlocks() {
      const grid = document.getElementById('workspaceGrid');
      const emptyState = document.getElementById('emptyState');

      grid.innerHTML = '';

      if (blocks.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      blocks.forEach((block, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col overflow-hidden';
        
        card.innerHTML = `
          <div class="bg-slate-50 border-b border-slate-200 px-4 py-2.5 flex items-center justify-between gap-2">
            <input type="text" value="${escapeHtml(block.title)}" onchange="updateTitle('${block.id}', this.value)" class="bg-transparent font-semibold text-slate-800 outline-none w-full text-sm focus:border-b focus:border-indigo-500">
            <div class="flex items-center gap-1">
              <button onclick="openFullscreen(${index})" class="p-1 text-slate-400 hover:text-indigo-600 rounded" title="Full Screen">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
              </button>
              <button onclick="requestDelete('${block.id}')" class="p-1 text-slate-400 hover:text-red-600 rounded" title="Delete">
                <i data-lucide="trash" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="p-4 flex-1 flex flex-col space-y-3">
            <div contenteditable="true" oninput="updateContent('${block.id}', this.innerHTML)" class="outline-none text-slate-600 text-sm min-h-[80px] flex-1">${block.content}</div>

            <!-- IMAGES -->
            <div class="space-y-2">
              ${block.images.map((img, imgIdx) => `
                <div class="relative group rounded-lg overflow-hidden border border-slate-200">
                  <img src="${img}" class="w-full h-32 object-cover">
                  <button onclick="removeImage('${block.id}',${imgIdx})" class="absolute top-1 right-1 bg-black/60 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </div>
              `).join('')}
            </div>

            <!-- IMPORT IMAGE TOOLBAR -->
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <label class="cursor-pointer hover:text-indigo-600 flex items-center gap-1">
                <i data-lucide="image" class="w-3.5 h-3.5"></i>
                <span>Import Picture</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload('${block.id}', event)">
              </label>
              <span>${block.updatedAt}</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    // UPDATE HANDLERS
    function updateTitle(id, val) {
      const b = blocks.find(x => x.id === id);
      if (b) { b.title = val; saveState(); }
    }

    function updateContent(id, val) {
      const b = blocks.find(x => x.id === id);
      if (b) { b.content = val; localStorage.setItem('poodle_blocks', JSON.stringify(blocks)); }
    }

    function handleImageUpload(id, event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const b = blocks.find(x => x.id === id);
        if (b) {
          b.images.push(e.target.result);
          saveState();
        }
      };
      reader.readAsDataURL(file);
    }

    function removeImage(id, imgIdx) {
      const b = blocks.find(x => x.id === id);
      if (b) {
        b.images.splice(imgIdx, 1);
        saveState();
      }
    }

    // DELETE CONFIRMATION
    function requestDelete(id) {
      deleteTargetId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    document.getElementById('cancelDeleteBtn').onclick = () => {
      deleteTargetId = null;
      document.getElementById('deleteModal').classList.add('hidden');
    };

    document.getElementById('confirmDeleteBtn').onclick = () => {
      if (deleteTargetId) {
        blocks = blocks.filter(x => x.id !== deleteTargetId);
        deleteTargetId = null;
        saveState();
      }
      document.getElementById('deleteModal').classList.add('hidden');
    };

    // BROWSE & SEARCH MODAL
    const browseModal = document.getElementById('browseModal');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    document.getElementById('browseBtn').onclick = () => {
      browseModal.classList.remove('hidden');
      searchInput.value = '';
      renderSearchResults('');
      searchInput.focus();
    };

    document.getElementById('closeBrowseBtn').onclick = () => {
      browseModal.classList.add('hidden');
    };

    searchInput.oninput = (e) => {
      renderSearchResults(e.target.value);
    };

    function renderSearchResults(query) {
      const q = query.toLowerCase().trim();
      const filtered = blocks.filter(b => b.title.toLowerCase().includes(q) || b.content.toLowerCase().includes(q));

      searchResults.innerHTML = '';
      if (filtered.length === 0) {
        searchResults.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No matching posts found.</div>`;
        return;
      }

      filtered.forEach(block => {
        const item = document.createElement('div');
        item.className = 'p-3 rounded-lg border border-slate-200 hover:border-indigo-500 hover:bg-slate-50 transition cursor-pointer';
        item.innerHTML = `
          <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(block.title)}</h4>
          <p class="text-xs text-slate-500 line-clamp-2 mt-1">${block.content.replace(/<[^>]*>?/gm, '')}</p>
        `;
        item.onclick = () => {
          browseModal.classList.add('hidden');
          const idx = blocks.findIndex(x => x.id === block.id);
          if (idx !== -1) openFullscreen(idx);
        };
        searchResults.appendChild(item);
      });
    }

    // FULLSCREEN FOCUS
    const fsModal = document.getElementById('fullscreenModal');
    const fsTitle = document.getElementById('fsTitle');
    const fsContent = document.getElementById('fsContent');
    const fsImageContainer = document.getElementById('fsImageContainer');

    function openFullscreen(index) {
      currentFsIndex = index;
      loadFsData();
      fsModal.classList.remove('hidden');
    }

    function loadFsData() {
      const b = blocks[currentFsIndex];
      if (!b) return;
      document.getElementById('fsIndex').innerText = `Block ${currentFsIndex + 1} of ${blocks.length}`;
      fsTitle.value = b.title;
      fsContent.innerHTML = b.content;

      fsImageContainer.innerHTML = b.images.map(img => `
        <img src="${img}" class="w-full max-h-[400px] object-cover rounded-xl border border-slate-200">
      `).join('');

      fsTitle.onchange = (e) => { updateTitle(b.id, e.target.value); };
      fsContent.oninput = () => { updateContent(b.id, fsContent.innerHTML); };
    }

    document.getElementById('closeFsBtn').onclick = () => fsModal.classList.add('hidden');
    document.getElementById('prevFsBtn').onclick = () => {
      if (currentFsIndex > 0) { currentFsIndex--; loadFsData(); }
    };
    document.getElementById('nextFsBtn').onclick = () => {
      if (currentFsIndex < blocks.length - 1) { currentFsIndex++; loadFsData(); }
    };

    // UTILS
    document.getElementById('addBlockBtn').onclick = addNewBlock;
    document.getElementById('clearAllBtn').onclick = () => {
      if (confirm('Are you sure you want to delete ALL blocks?')) {
        blocks = [];
        saveState();
      }
    };
    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(blocks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'poodle-workspace.json';
      a.click();
    };

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
